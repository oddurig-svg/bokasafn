name: Restructure Beta frontend

on:
  push:
    branches:
      - Beta
    paths:
      - '.github/scripts/restructure.py'
      - '.github/workflows/restructure-beta.yml'

permissions:
  contents: write

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Beta
        uses: actions/checkout@v4
        with:
          ref: Beta

      - name: Run safe restructuring
        run: python .github/scripts/restructure.py

      - name: Commit generated structure
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No restructuring changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css js
          git commit -m "Restructure frontend files"
          git push origin Beta
